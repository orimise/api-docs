# Copied from orimise/docs-portal docs/ci/publish-public-docs.yml on 2026-10-04; space is fixed per repository.
#
# Pushes the ODF-1 guides under docs/public/ to Orimise Docs after every change
# on the main branch. The job is an editor, not an admin: a new guide lands as
# internal and an admin makes it public once on docs.orimise.com; later runs
# keep that decision.
#
# Secrets: DOCS_PUBLISH_TOKEN (the same value as in devops/services/docs/.env.production).

name: Publish public docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/public/**"
      - ".github/workflows/publish-public-docs.yml"
      - ".github/scripts/publish-public-docs.mjs"
  workflow_dispatch:

concurrency:
  group: publish-public-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The script is vendored from orimise/docs-portal scripts/publish-public-docs.mjs
      # (commit 139ca89); that repository is private, so it cannot be fetched at run time.
      - name: Dry run
        run: node .github/scripts/publish-public-docs.mjs --dir docs/public --space ai-gateway --dry-run

      - name: Publish
        env:
          DOCS_PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        run: node .github/scripts/publish-public-docs.mjs --dir docs/public --space ai-gateway
